# This workflow builds and uplo
# using Apple signing credentials and App Store Connect API Key secrets.

name: build-test

# Controls when the workflow will run
on:
  push:
    branches:
      - main # Trigger the workflow on pushes to the 'master' branch.

jobs:
  build: # make sure build/ci work properly
    # Specify the operating system for the runner
    runs-on: macos-latest
    # timeout-minutes: 30 # Removed as requested

    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: actions/checkout@v2

      # Imports Apple signing certificates from GitHub Secrets
      - uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }} # Base64 content of your .p12 certificate
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} # Password for your .p12 file

      # Downloads provisioning profiles from Apple using App Store Connect API Key
      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: codes.orj.Example-iOS # Replace with your app's Bundle ID
          profile-type: 'IOS_APP_STORE' # Specify the profile type (e.g., IOS_APP_STORE, IOS_APP_DEVELOPMENT)
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }} # Your App Store Connect Issuer ID (from secret)
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }} # Your App Store Connect Key ID (from secret)
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }} # Your App Store Connect Private Key content (from secret)

      # Generates a unique build number for the app
      - name: "#️⃣ Generate Build Number"
        id: buildnumber # Assigns an ID to this step
        uses: einaregilsson/build-number@v2
        with:
          # The github_token is automatically provided by GitHub Actions
          # and is used by this action to interact with the GitHub API
          # to get information needed to generate the build number.
          token: ${{ secrets.github_token }}

      # Runs your custom build script
      - run: ./Build # Executes a script named 'Build' in your repository root
