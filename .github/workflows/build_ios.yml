name: build-test-xcodebuild

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      APPSTORE_PRIVATE_KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      KEYCHAIN_NAME: "signing_temp.keychain-db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Set Keychain Path Environment Variable
        run: |
          echo "HOME is: '$HOME'"
          if [ -z "$HOME" ]; then
            echo "Error: \$HOME is not set!"
            exit 1
          fi
          FULL_KEYCHAIN_PATH="$HOME/Library/Keychains/${{ env.KEYCHAIN_NAME }}"
          echo "KEYCHAIN_PATH=$FULL_KEYCHAIN_PATH" >> $GITHUB_ENV

      # Enhanced Certificate Import with Keychain Configuration
      - name: Import and Configure Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain: ${{ env.KEYCHAIN_NAME }}
          create-keychain: true

      - name: Configure Keychain Settings
        run: |
          security list-keychains -d user -s ${{ env.KEYCHAIN_PATH }}
          security default-keychain -d user -s ${{ env.KEYCHAIN_PATH }}
          security unlock-keychain -p "" ${{ env.KEYCHAIN_PATH }}
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" ${{ env.KEYCHAIN_PATH }}
          security find-identity -v -p codesigning ${{ env.KEYCHAIN_PATH }}

      - name: Configure Xcode Project
        run: |
          /usr/libexec/PlistBuddy -c "Set :objects:*/buildSettings:DEVELOPMENT_TEAM ${{ secrets.APPLE_TEAM_ID }}" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :objects:*/buildSettings:PROVISIONING_PROFILE_SPECIFIER 'iOS Team Provisioning Profile: ${{ secrets.APPLE_BUNDLE_ID }}'" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :objects:*/buildSettings:CODE_SIGN_STYLE Manual" ios/Runner.xcodeproj/project.pbxproj

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v2
        with:
          bundle-id: com.literalomicus.kangarule
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}

      - name: Get Code Signing Identity
        id: get_signing_identity
        run: |
          IDENTITY_NAME=$(security find-identity -p codesigning -v ${{ env.KEYCHAIN_PATH }} | grep "Apple Distribution:" | head -n 1 | sed -E 's/.*"(.+)".*/\1/')
          echo "identity_name=$IDENTITY_NAME" >> $GITHUB_OUTPUT
          echo "CODE_SIGN_IDENTITY_NAME=$IDENTITY_NAME" >> $GITHUB_ENV

      - name: Generate Build Number
        id: buildnumber
        uses: einaregilsson/build-number@v2
        with:
          token: ${{ secrets.github_token }}

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -workspace ./ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            PROVISIONING_PROFILE_SPECIFIER="literalomicus" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY_NAME }}" \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -authenticationPrivateKey "${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}" \
            -keychain "${{ env.KEYCHAIN_PATH }}" \
            -verbose

      - name: Export IPA
        run: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -authenticationPrivateKey "${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}" \
            -keychain "${{ env.KEYCHAIN_PATH }}" \
            -verbose

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}

      - name: Clean up
        if: ${{ always() }}
        run: |
          security delete-keychain ${{ env.KEYCHAIN_PATH }} || true
