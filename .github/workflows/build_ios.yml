# This workflow builds and uploads an iOS app to TestFlight
# using Apple signing credentials and App Store Connect API Key secrets.

name: build-test

# Controls when the workflow will run
on:
  # rebuild any PRs and main branch changes
  push:
    branches:
      - main # Trigger the workflow on pushes to the 'master' branch.

jobs:
  build: # make sure build/ci work properly
    # Specify the operating system for the runner
    runs-on: macos-latest
    # timeout-minutes: 30 # Removed as requested

    # Grant permissions for the github_token for this job
    permissions:
      contents: write # This grants write access to repository contents, including refs

    # Set environment variables for the job
    env:
      # WARNING: This allows the use of deprecated and potentially insecure commands
      # like ::set-env and ::add-path. Only use this if necessary and understand
      # the security implications. It's recommended to update actions to use
      # environment files instead.
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your workflow can access it
      - uses: actions/checkout@v2

      # Set up Flutter SDK
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Specify the Flutter channel

      # --- Diagnostic Step ---
      # Check if flutter command is available and show the PATH
      - name: Check Flutter setup
        run: |
          echo "Checking flutter command availability:"
          which flutter || echo "flutter command not found after setup."
          echo "Current PATH:"
          echo $PATH
        # This step will help determine if the previous setup action worked.
      # --- End Diagnostic Step ---


      # Imports Apple signing certificates from GitHub Secrets
      - uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }} # Base64 content of your .p12 certificate
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} # Password for your .p12 file

      # --- Diagnostic Step ---
      # Check if the certificate was installed in the keychain
      - name: Verify Certificate Installation
        run: |
          echo "Checking keychains for installed identities:"
          security find-identity -p codesigning -v
          # This command lists valid code signing identities found in accessible keychains.
          # Look for your "Apple Distribution: Your Name (Team ID)" identity here.
        # This step helps confirm if the previous action successfully imported the certificate.
      # --- End Diagnostic Step ---

      # Downloads provisioning profiles from Apple using App Store Connect API Key
      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: com.literalomicus.kangarule # Your app's Bundle ID
          profile-type: 'IOS_APP_STORE' # Specify the profile type (e.g., IOS_APP_STORE, IOS_APP_DEVELOPMENT)
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }} # Your App Store Connect Issuer ID (from secret)
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }} # Your App Store Connect Key ID (from secret)
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }} # Your App Store Connect Private Key content (from secret)

      # --- Diagnostic Step ---
      # Check if the provisioning profile was downloaded to the correct directory
      - name: Verify Provisioning Profile Download
        run: |
          echo "Checking provisioning profile directory:"
          ls -laR ~/Library/MobileDevice/Provisioning\ Profiles/
          # This command lists the contents of the standard provisioning profiles directory.
          # Look for a file ending in .mobileprovision that matches your App Store profile.
        # This step helps confirm if the previous action downloaded and placed the profile correctly.
      # --- End Diagnostic Step ---
      - name: Configure Keychain for Build
  run: |
    # List available identities in the *default* search path for debugging
    echo "Listing identities in default search path:"
    security find-identity -v -p codesigning || true # Use || true to prevent step failure if no identities found
    
    # Make signing_temp.keychain searchable by adding it to the user's search list
    echo "Adding signing_temp.keychain to user search list:"
    security list-keychains -d user -s signing_temp.keychain login.keychain
    
    # Set default keychain (sometimes needed, but list-keychains -s is often sufficient)
    # echo "Setting signing_temp.keychain as default:"
    # security default-keychain -d user -s signing_temp.keychain # Uncomment if needed
    
    # Unlock the keychain (required for CI to access private keys)
    echo "Unlocking signing_temp.keychain:"
    security unlock-keychain -p "" signing_temp.keychain # Use your actual KEYCHAIN_PASSWORD secret here if you set one when creating the keychain!
    
    # --- Added Diagnostic Command ---
    # Verify the signing identity is present *specifically* in signing_temp.keychain
    echo "Listing identities specifically in signing_temp.keychain:"
    security find-identity -v -p codesigning signing_temp.keychain || true # Use || true to prevent step failure if no identities found
    # --- End Added Diagnostic Command ---
    
    # Verify the certificate is accessible (optional, but good check)
    # Replace "Apple Development" with the common name of your certificate if different
    echo "Checking for 'Apple Development' certificate in signing_temp.keychain:"
    security find-certificate -c "Apple Development" signing_temp.keychain || true

      # Generates a unique build number for the app
      # This action requires write permissions to create/update a Git ref.
      - name: "#️⃣ Generate Build Number"
        id: buildnumber # Assigns an ID to this step
        uses: einaregilsson/build-number@v2
        with:
          # The github_token is automatically provided by GitHub Actions
          # and is used by this action to interact with the GitHub API
          # to get information needed to generate the build number.
          # The 'contents: write' permission is needed for this.
          token: ${{ secrets.github_token }}

      # Run the Flutter build command to create the iOS IPA
      - name: Build iOS IPA
        run: |
          # Ensure you have the correct Bundle ID set in your Xcode project.
          # The installed provisioning profile must match the Bundle ID.
          flutter build ipa --release \
            --build-number=${{ steps.buildnumber.outputs.build_number }} \
            --build-name=1.0.${{ github.run_number }} \
            # The bundle-id flag can override the one in Xcode, but it's usually
            # best to ensure they match and let the profile handle it.
            # --bundle-id=com.literalomicus.kangarule \ # Uncomment and use if needed
            # --team-id=${{ secrets.APPLE_TEAM_ID }} # Optional: Specify team ID if needed by your setup

          # Note: If you use Flutter flavors, you might need to add --flavor=<flavor_name>

      # Uploads the generated IPA file to App Store Connect for TestFlight
      - uses: Apple-Actions/upload-testflight-build@master # Using the 'master' branch of the action
        with:
          # The default output path for flutter build ipa is build/ios/ipa/
          app-path: build/ios/ipa/*.ipa # Path to the built IPA file
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }} # Your App Store Connect Issuer ID (from secret)
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }} # Your App Store Connect Key ID (from secret)
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }} # Your App Store Connect Private Key content (from secret)
