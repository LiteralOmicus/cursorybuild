name: Deploy Flutter iOS to TestFlight (ASC API Key)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build_and_deploy_ios:
    runs-on: macos-latest
    permissions:
      contents: write # Needed for build-number action
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      FLUTTER_ROOT: /Users/runner/hostedtoolcache/flutter/3.22.8-stable/macos 
      COCOAPODS_SKIP_UPDATE: 'TRUE' 
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY_CONTENT }} # Content of your .p8 key file
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }} 

    steps:
      # Use an action to select a specific Xcode version
      - name: Select Xcode 26.1.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1' # Use the latest stable version 

      - name: Show Xcode Version (for verification)
        run: xcodebuild -version
     
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Or 'beta', 'master' if you use them
          flutter-version: '3.32.8' # Specify exact version for consistency
          cache: true

      - name: Final Guaranteed Clean and Fix
        run: |
         flutter clean
         rm -rf ios/Pods
         rm -f ios/Podfile.lock
         rm -rf ios/Runner.xcworkspace
         flutter pub get
         cd ios
         pod install --repo-update --clean-install --verbose || { echo "Pod install failed to apply final fix!"; exit 1; }
         cd ..
      
      - name: Run Flutter Doctor -v
        run: flutter doctor -v
          
      - name: List Directories after Flutter Setup (Verify Podfile existence)
        run: |
          echo "--- Current directory: $(pwd) ---"
          echo "--- Listing contents of ios/ directory ---"
          ls -la ios/
          echo "--- Displaying content of ios/Podfile ---"
          cat ios/Podfile || echo "Podfile not found at ios/Podfile"
          echo "--- Debug: Directory listing complete ---"
      - name: Force Clean Pod Installation
        run: |
          echo "--- Forcing clean pod installation ---"
          cd ios
          # Ensure lock file and pods are removed before clean install
          rm -f Podfile.lock 
          rm -rf Pods/
          # Run install to rebuild Pods and Target Support Files
          pod install --repo-update || { echo "Pod install failed!"; exit 1; }
          cd ..
          echo "--- Pod installation complete ---"
      - name: Verify CocoaPods Installation for audio_session
        run: |
          echo "--- Checking Podfile.lock for audio_session ---"
          # This should show if audio_session was successfully listed as a dependency
          grep "audio_session" ios/Podfile.lock || echo "Warning: audio_session not found in Podfile.lock. This is suspicious."
          
          echo "--- Listing contents of Pods/Headers/Public/ ---"
          # Check if the public headers directory exists
          ls -la ios/Pods/Headers/Public/ || echo "Warning: Pods/Headers/Public/ not found or empty. Module headers might be missing."
          
          echo "--- Listing contents of Pods/Headers/Public/audio_session/ ---"
          # Explicitly check for audio_session's public headers
          ls -la ios/Pods/Headers/Public/audio_session/ || echo "Warning: audio_session headers not found in public directory. Module might not be correctly integrated."
          
          echo "--- Listing contents of Pods/audio_session/ ---"
          # Check the root pod directory itself
          ls -la ios/Pods/audio_session/ || echo "Warning: audio_session pod directory not found."
      - name: Patch Pods Project for Privacy Bundles
        run: |
          echo "--- Starting comprehensive workaround to patch Pods.xcodeproj ---"
          PODS_PROJECT_PATH="./ios/Pods/Pods.xcodeproj"
          if [ -d "$PODS_PROJECT_PATH" ]; then
            echo "Modifying Pods project at $PODS_PROJECT_PATH"
            # We use ruby to find targets that look like privacy bundles and set EMBEDDED_CONTENT_CONTAINS_SWIFT to NO
            ruby -e "
              require 'xcodeproj'
              project = Xcodeproj::Project.open(ARGV[0])
              
              fixed_targets_count = 0
              project.targets.each do |target|
                # Targets named like '*-privacy' or ending in '_privacy.bundle' are the culprits.
                if target.name.include?('_privacy') || target.name.end_with?('_privacy.bundle')
                  puts \"Found privacy bundle target: '#{target.name}'. Updating build settings...\"
                  target.build_configurations.each do |config|
                    config.build_settings['EMBEDDED_CONTENT_CONTAINS_SWIFT'] = 'NO'
                  end
                  fixed_targets_count += 1
                end
              end
              
              if fixed_targets_count > 0
                project.save
                puts \"Successfully patched build settings for \#{fixed_targets_count} targets.\"
              else
                puts \"No privacy bundle targets found that needed patching. Continuing build.\"
              end
            " "$PODS_PROJECT_PATH"
          else
            echo "Pods project not found at $PODS_PROJECT_PATH. Skipping workaround."
            # Exit with 0 if the pods folder is missing, as that means pod install failed earlier.
          fi
          echo "--- Workaround complete ---"
      - name: Import Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}
          provisioning-profiles-base64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}

      - name: Install Apple Intermediate Certificate
        run: |
         curl -o apple_g4.cer https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer
         /usr/bin/security import apple_g4.cer -k signing_temp.keychain -t cert -f pkcs7 -A
         /usr/bin/security unlock-keychain -p "${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}" signing_temp.keychain
         echo "Apple Worldwide Developer Relations G4 Certificate imported."
      - name: 🔎 Verify Installed Code Signing Identity
        env:
          KEYCHAIN_NAME: signing_temp.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          echo "--- Listing identities in $KEYCHAIN_NAME ---"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          /usr/bin/security find-identity -v -p codesigning "$KEYCHAIN_NAME" \
          | tee codesigning_check.log
          echo "--- Diagnostic Complete ---"
      - name: 📦 Upload Codesigning Diagnostic Log
        uses: actions/upload-artifact@v4
        with:
          name: codesigning-identity-check
          path: codesigning_check.log
          retention-days: 1

      - name: Grant Full Codesign Access
        env:
         KEYCHAIN_PASS: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }} 
        run: |
            KEYCHAIN_NAME="signing_temp.keychain"
            /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,security:,productbuild: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN_NAME"
      - name: 3. Unlock Temporary Keychain
        run: |
          /usr/bin/security unlock-keychain \
          -p "${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}" signing_temp.keychain
      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v2
        with:
          bundle-id: com.literalomicus.kangarule # Replace with your app's Bundle ID
          profile-type: 'IOS_APP_STORE' # Or 'IOS_APP_DEVELOPMENT' for development builds
          issuer-id: ${{ env.ASC_ISSUER_ID }}
          api-key-id: ${{ env.ASC_KEY_ID }}
          api-private-key: ${{ env.ASC_PRIVATE_KEY_CONTENT }}

      - name: Install Provisioning Profile
        env:
    # This is your Base64 encoded secret from GitHub
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }} 
        run: |
         mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
         echo $PROFILE_BASE64 | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app_store_profile_uuid.mobileprovision
      - name: Get Code Signing Identity Name
        id: get_signing_identity
        run: |
          echo "Finding code signing identity name created by provisioning profile download..."
          IDENTITY_NAME=$(security find-identity -p codesigning -v 2>&1 | grep "Apple Distribution:" | head -n 1 | sed -E 's/.*"(.+)".*/\1/')
          
          if [ -z "$IDENTITY_NAME" ]; then
            echo "Error: Code signing identity 'Apple Distribution:' not found in any keychain. Build cannot proceed."
            exit 1
          else
            echo "Found signing identity: '$IDENTITY_NAME'"
            echo "CODE_SIGN_IDENTITY_NAME=$IDENTITY_NAME" >> $GITHUB_ENV
          fi
          
      - name: Retrieve and Store Signing Certificate Hash
        id: get_cert_hash
        run: |
          CERT_HASH=$(security find-identity -p codesigning -v \
          | grep 'Apple Distribution' \
          | awk '{print $2}' \
          | tr -d '[:space:]"')
          if [ -z "$CERT_HASH" ]; then
          echo "ERROR: Could not find Apple Distribution certificate hash. Check p12 credentials."
          exit 1
          fi
          echo "Found Certificate Hash: $CERT_HASH"
          echo "CERT_HASH=$CERT_HASH" >> $GITHUB_OUTPUT
      
      - name: Generate Build Number
        id: buildnumber
        uses: einaregilsson/build-number@v2
        with:
          token: ${{ secrets.github_token }}

      - name: Inspect webview_flutter_wkwebview_privacy.bundle
        if: ${{ always() }} # Run this step even if the patch fails, for maximum debug info
        run: |
          echo "--- Verifying webview_flutter_wkwebview_privacy.bundle existence and contents ---"
          
          # 1. Check for the existence of the bundle directory
          BUNDLE_PATH="./ios/Pods/Target Support Files/webview_flutter_wkwebview-webview_flutter_wkwebview_privacy"
          if [ -d "$BUNDLE_PATH" ]; then
            echo "✅ Found Target Support Files directory for the bundle."
            echo "Listing contents of $BUNDLE_PATH:"
            ls -la "$BUNDLE_PATH"
          else
            echo "❌ Target Support Files directory not found at: $BUNDLE_PATH"
          fi
          
          # 2. Look for the actual bundle file (though it might be generated later)
          # A more reliable check is to see the target's build settings in the Pods project
          
          # 3. Use grep to confirm if the build settings were applied in the Pods.xcodeproj
          # This requires the Pods project to be openable, which the previous Ruby step handles.
          # Since the Ruby step modified the Pods project, we can look at the project.pbxproj
          
          # Note: Directly grepping the pbxproj for EMBEDDED_CONTENT_CONTAINS_SWIFT='NO'
          # for the target name is the best way to confirm the Ruby patch worked.
          echo "--- Checking Pods.xcodeproj for EMBEDDED_CONTENT_CONTAINS_SWIFT=NO ---"
          grep -C 5 "webview_flutter_wkwebview_privacy" ./ios/Pods/Pods.xcodeproj/project.pbxproj | grep "EMBEDDED_CONTENT_CONTAINS_SWIFT" || echo "Warning: Could not confirm patch via grep. Check Ruby script output."
          
          echo "--- Inspection complete ---"
        
      - name: Direct xcrun Archive
        env:
          SIGNING_IDENTITY: "74BBDDE5CA956B2FE76375C7B2D8086B8E00DAD8"
          PROVISIONING_PROFILE_UUID: "63fcd44a-ff22-44db-8b80-ce59919d6ef9"
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCHIVE_PATH: "${{ github.workspace }}/build/ios/archive/Runner.xcarchive"
          PROFILE_NAME: "literalomicus"
          KEYCHAIN_PATH: "${{ github.workspace }}/signing_temp.keychain"
        run: |
         CODE_SIGN_FLAGS="--keychain=${{ env.KEYCHAIN_PATH }}"
         /usr/bin/xcrun xcodebuild archive \
         -workspace ios/Runner.xcworkspace \
         -scheme Runner \
         -configuration Release \
         -sdk iphoneos \
         -destination generic/platform=iOS \
         -archivePath "$ARCHIVE_PATH" \
         DEVELOPMENT_TEAM="$TEAM_ID" \
         CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
         "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" \
         "PROVISIONING_PROFILE=$PROVISIONING_PROFILE_UUID" \
         OTHER_CODE_SIGN_FLAGS="$CODE_SIGN_FLAGS" \
         | tee -a ${{ env.LOG_FILE }} 

      
    # This should now result in a file at build/ios/ipa/Runner.ipa
      - name: Manual xcrun Export to IPA (Forces Identity)
        env:
         IPA_PATH: "${{ github.workspace }}/build/ios/ipa"
         SIGNING_IDENTITY:  "Apple Distribution: literalomicus (6ABV2967CN)" 
         ARCHIVE_PATH: "${{ github.workspace }}/build/ios/archive/Runner.xcarchive"
        run: |
          mkdir -p "$IPA_PATH"
          /usr/bin/xcrun xcodebuild -exportArchive \
          -archivePath "$ARCHIVE_PATH" \
          -exportPath "$IPA_PATH" \
           | tee -a ${{ env.LOG_FILE }} 
      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.LOG_FILE }}
          retention-days: 2
          
      - name: 📦 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
            name: app-ipa
            path: build/ios/ipa/*.ipa
            retention-days: 2
        
      - name: Upload IPA to TestFlight
        if: ${{ success() }} 
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ env.ASC_ISSUER_ID }}
          api-key-id: ${{ env.ASC_KEY_ID }}
          api-private-key: ${{ env.ASC_PRIVATE_KEY_CONTENT }}
