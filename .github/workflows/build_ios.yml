name: Deploy Flutter iOS to TestFlight (ASC API Key)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build_and_deploy_ios:
    runs-on: macos-latest
    permissions:
      contents: write # Needed for build-number action
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY_CONTENT }} # Content of your .p8 key file
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Define the target minimum iOS version here for use in the build step
      IOS_DEPLOYMENT_TARGET: '14.0' 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        # This action automatically handles setting up the environment, including gems like CocoaPods.
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.8' # Use a specific version for reliability
          cache: true

      - name: Run Flutter Doctor -v
        run: flutter doctor -v

      - name: Clean Project and Get Dependencies
        # flutter pub get will also trigger the necessary pod install command via the podhelper.rb
        run: |
          flutter clean
          flutter pub get

      - name: Select Xcode version
        # Recommended to use the action's built-in macos-version or select the version available on the runner.
        # Ensure the specified version is available on the macos-latest runner image.
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
        
      # --- REMOVED AGGRESSIVE COCOAPODS CLEANUP ---
      # Removed the entire "Clean CocoaPods Environment and Install" step.
      # The `flutter pub get` step above is sufficient and runs `pod install` correctly.
      
      # --- REMOVED AGGRESSIVE COCOAPODS VERIFICATION ---
      # Removed the entire "Verify CocoaPods Installation for audio_session" step as it's debugging.

      - name: Import Apple Distribution Certificate
        uses: Apple-Actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v2
        with:
          bundle-id: com.literalomicus.kangarule # Replace with your app's Bundle ID
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ env.ASC_ISSUER_ID }}
          api-key-id: ${{ env.ASC_KEY_ID }}
          api-private-key: ${{ env.ASC_PRIVATE_KEY_CONTENT }}

      - name: Get Code Signing Identity Name
        id: get_signing_identity
        run: |
          IDENTITY_NAME=$(security find-identity -p codesigning -v 2>&1 | grep "Apple Distribution:" | head -n 1 | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$IDENTITY_NAME" ]; then
            echo "Error: Code signing identity 'Apple Distribution:' not found. Build cannot proceed."
            exit 1
          else
            echo "Found signing identity: '$IDENTITY_NAME'"
            echo "CODE_SIGN_IDENTITY_NAME=$IDENTITY_NAME" >> $GITHUB_ENV
          fi

      - name: Create ExportOptions.plist
        run: |
          EXPORT_OPTIONS_PLIST_PATH="build/ios/ExportOptions.plist"
          mkdir -p build/ios
          cat <<EOF > "${EXPORT_OPTIONS_PLIST_PATH}"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ env.APPLE_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          echo "EXPORT_OPTIONS_PLIST_PATH=$EXPORT_OPTIONS_PLIST_PATH" >> $GITHUB_ENV

      - name: Generate Build Number
        id: buildnumber
        uses: einaregilsson/build-number@v2
        with:
          token: ${{ secrets.github_token }}

      # --- REMOVED AGGRESSIVE RUBY WORKAROUND ---
      # Removed the entire "Remove CopySwiftLibs build phase" step. 
      # This aggressive step is not necessary for a clean build and should be avoided.
      
      - name: Build and Archive iOS App
        run: |
          PROJECT_OR_WORKSPACE_PATH="./ios/Runner.xcworkspace"
          SCHEME_NAME="Runner"
          ARCHIVE_OUTPUT_PATH="build/Runner.xcarchive"
          
          # The flutter build process handles setting the build number correctly based on pubspec.yaml
          # and the build-number action's output.
          
          # We use xcodebuild directly for more control over the archive process
          xcodebuild clean archive \
            -workspace "${PROJECT_OR_WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${ARCHIVE_OUTPUT_PATH}" \
            IPHONEOS_DEPLOYMENT_TARGET=${{ env.IOS_DEPLOYMENT_TARGET }} \
            DEVELOPMENT_TEAM="${{ env.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY_NAME }}" \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            -allowProvisioningUpdates \
            -verbose 2>&1 | tee xcodebuild_archive_log.txt
          
          echo "ARCHIVE_PATH=$ARCHIVE_OUTPUT_PATH" >> $GITHUB_ENV

      - name: Upload Xcodebuild Archive Log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-log
          path: xcodebuild_archive_log.txt
          retention-days: 7

      - name: Export IPA from Archive
        run: |
          IPA_OUTPUT_DIR="build/ios/ipa"
          EXPORT_OPTIONS_PLIST_PATH="${{ env.EXPORT_OPTIONS_PLIST_PATH }}"
          
          mkdir -p "${IPA_OUTPUT_DIR}"
          xcodebuild -exportArchive \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -exportPath "${IPA_OUTPUT_DIR}" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST_PATH}" \
            -allowProvisioningUpdates \
            -verbose 2>&1 | tee xcodebuild_export_log.txt
          
          echo "IPA_OUTPUT_DIR=$IPA_OUTPUT_DIR" >> $GITHUB_ENV

      - name: Upload Xcodebuild Export Log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-export-log
          path: xcodebuild_export_log.txt
          retention-days: 7

      - name: Upload IPA artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-app
          path: ${{ env.IPA_OUTPUT_DIR }}/*.ipa
          retention-days: 7

      - name: Upload IPA to TestFlight
        if: ${{ success() }}
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_OUTPUT_DIR }}/*.ipa
          issuer-id: ${{ env.ASC_ISSUER_ID }}
          api-key-id: ${{ env.ASC_KEY_ID }}
          api-private-key: ${{ env.ASC_PRIVATE_KEY_CONTENT }}
