name: build-test-xcodebuild

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      APPSTORE_PRIVATE_KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      KEYCHAIN_NAME: "signing_temp.keychain"
      KEYCHAIN_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      # 1. Configure Automatic Signing in Xcode project
      - name: Configure Automatic Signing
        run: |
          # Enable automatic signing
          /usr/libexec/PlistBuddy -c "Set :objects:*/buildSettings:CODE_SIGN_STYLE Automatic" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Delete :objects:*/buildSettings:DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Delete :objects:*/buildSettings:PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj
          
          # Verify changes
          echo "Automatic signing configuration:"
          grep -A1 CODE_SIGN_STYLE ios/Runner.xcodeproj/project.pbxproj || echo "Using default automatic signing"

      # 2. Generate ExportOptions.plist
      - name: Generate ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Pub Get
        run: flutter pub get

      # 3. Keychain setup
      - name: Create and Configure Keychain
        run: |
          security create-keychain -p "${{ env.KEYCHAIN_PASSWORD }}" "${{ env.KEYCHAIN_NAME }}"
          security set-keychain-settings -lut 21600 "${{ env.KEYCHAIN_NAME }}"
          security unlock-keychain -p "${{ env.KEYCHAIN_PASSWORD }}" "${{ env.KEYCHAIN_NAME }}"
          security list-keychains -d user -s "${{ env.KEYCHAIN_NAME }}" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ env.KEYCHAIN_PASSWORD }}" "${{ env.KEYCHAIN_NAME }}"

      - name: Import Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain: ${{ env.KEYCHAIN_NAME }}
          keychain-password: ${{ env.KEYCHAIN_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v2
        with:
          bundle-id: com.literalomicus.kangarule
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}

      # 4. Build with Automatic Signing
      - name: Build and Archive (Automatic Signing)
        run: |
          xcodebuild clean archive \
            -workspace ./ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -authenticationPrivateKey "${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}" \
            -keychain "${{ env.KEYCHAIN_NAME }}" \
            -verbose

      - name: Export IPA
        run: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -authenticationPrivateKey "${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}" \
            -keychain "${{ env.KEYCHAIN_NAME }}" \
            -verbose

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: build/ios/ipa/*.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}

      - name: Clean up
        if: ${{ always() }}
        run: |
          security delete-keychain "${{ env.KEYCHAIN_NAME }}" || true
