name: Deploy Flutter iOS to TestFlight (No Mac Local)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_ios:
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean CocoaPods Environment and Install
        # This is the crucial step to make more robust
        run: |
          echo "--- Starting CocoaPods setup ---"
          
          # 1. Ensure correct Ruby environment for CocoaPods
          # Use Homebrew-installed Ruby if available, often more reliable than system Ruby.
          # The `chruby-release` action or manual setup ensures a consistent Ruby.
          # GitHub's `macos-latest` usually has Homebrew Ruby, but explicit paths can help.
          
          # Forcing a specific Ruby version (if needed, e.g., 3.1.x, 3.2.x, 3.3.x)
          # if the default one causes issues. The `gems/3.3.0` in your error implies Ruby 3.3.0 is used.
          
          # Clean up any potential old/conflicting CocoaPods installations
          sudo gem uninstall cocoapods -ax --force || true # -ax: uninstall all versions, --force: no confirmation
          sudo gem uninstall cocoapods-core -ax --force || true
          
          # Update RubyGems itself
          sudo gem update --system
          
          # Reinstall CocoaPods using `sudo` to ensure it's installed globally for the runner
          # -n /usr/local/bin ensures it's placed in a standard PATH location
          sudo gem install cocoapods -n /usr/local/bin --no-document
          
          # Verify CocoaPods version
          pod --version
          
          # 2. Update CocoaPods Specs Repo (Crucial for fresh installs/updates)
          # This pulls down the latest information about all available pods.
          # This can take some time.
          echo "--- Updating CocoaPods spec repo ---"
          # Only run if not already updated recently or if issues persist.
          # Forcing update can resolve "No such pod found" errors.
          pod repo update || true # Use || true to prevent failure on transient issues
          
          # 3. Clean and install pods for your project
          echo "--- Cleaning and installing project pods ---"
          cd ios/
          rm -rf Pods/ # Remove existing pods to ensure clean install
          rm -f Podfile.lock # Remove lock file to force resolution
          pod install --repo-update # --repo-update here forces an update of the specs for this install
          
          echo "--- CocoaPods setup complete ---"
        # Add additional error handling / debug output if needed
        # continue-on-error: true # Consider this temporarily if you want to see subsequent errors

      # Rest of your workflow steps remain the same
      - name: Create Temporary Keychain for Signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "${HOME}/Library/Keychains/build.keychain"
          security default-keychain -s "${HOME}/Library/Keychains/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "${HOME}/Library/Keychains/build.keychain"
          security set-keychain-settings -t 3600 -l "${HOME}/Library/Keychains/build.keychain"
          echo "Temporary keychain created and unlocked."

      - name: Configure App Store Connect API Key for Xcode CLI
        env:
          ASC_PRIVATE_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "App Store Connect API key saved to ~/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Build and Archive iOS App
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=$(git rev-list --count HEAD) \
            --build-name=1.0.0.$(git rev-list --count HEAD)
          
          ls -l build/ios/ipa/

      - name: Upload IPA to TestFlight
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa")
          echo "Found IPA: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

          echo "Upload command executed. Check App Store Connect for processing status."
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.GOOG_ASC_ISSUER_ID }}

      - name: Delete Temporary Keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "${HOME}/Library/Keychains/build.keychain"
          echo "Temporary keychain deleted."

      - name: Upload IPA artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-app
          path: build/ios/ipa/*.ipa
          retention-days: 7
