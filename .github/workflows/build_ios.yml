name: Deploy Flutter iOS to TestFlight (No Mac Local)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_ios:
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true' 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Clean Flutter Project and Regenerate iOS Structure
        run: |
          echo "--- Cleaning Flutter project ---"
          flutter clean
          echo "--- Removing and regenerating iOS folder ---"
          rm -rf ios/ 
          flutter create . 
          echo "--- Getting Flutter dependencies ---"
          flutter pub get
          echo "--- Flutter dependencies retrieved ---"

      - name: Debug: List Directories after Flutter Setup # <--- NEW DEBUG STEP 1
        run: |
          echo "--- Current directory: $(pwd) ---"
          echo "--- Listing project root contents (cursorybuild/) ---"
          ls -la
          echo "--- Listing .symlinks/ contents ---"
          ls -la .symlinks/ || echo "'.symlinks/' directory not found or empty."
          echo "--- Listing .symlinks/flutter/ios/ contents ---"
          ls -la .symlinks/flutter/ios/ || echo "'.symlinks/flutter/ios/' directory not found or empty."
          echo "--- Checking for specific Flutter.podspec file ---"
          find . -name "Flutter.podspec"
          echo "--- Listing contents of ios/ directory ---"
          ls -la ios/
          echo "--- Listing contents of ios/Runner.xcodeproj/ ---"
          ls -la ios/Runner.xcodeproj/ || echo "'ios/Runner.xcodeproj/' not found."
          echo "--- Debug: Directory listing complete ---"

      - name: Clean CocoaPods Environment and Install
        run: |
          echo "--- Starting CocoaPods setup ---"
          sudo gem uninstall cocoapods -ax --force || true
          sudo gem uninstall cocoapods-core -ax --force || true
          
          sudo gem update --system
          sudo gem install cocoapods -n /usr/local/bin --no-document
          pod --version
          
          echo "--- Updating CocoaPods spec repo ---"
          pod repo update || true
          
          echo "--- Cleaning and installing project pods ---"
          cd ios/
          rm -rf Pods/ 
          rm -f Podfile.lock 
          # Ensure Flutter.podspec is valid after pub get before running pod install
          # We've already confirmed this in the debug step above, but if you want another check:
          # if [ ! -f ../.symlinks/flutter/ios/Flutter.podspec ]; then
          #   echo "ERROR: Flutter.podspec is still missing before pod install. Aborting."
          #   exit 1
          # fi
          pod install --repo-update
          
          echo "--- CocoaPods setup complete ---"

      - name: Debug: List Directories after Pod Install # <--- NEW DEBUG STEP 2
        run: |
          echo "--- Current directory (inside ios/): $(pwd) ---"
          echo "--- Listing ios/ contents after pod install ---"
          ls -la
          echo "--- Listing Pods/ contents ---"
          ls -la Pods/ || echo "'Pods/' directory not found or empty."
          echo "--- Debug: Directory listing complete ---"
          cd .. # Go back to root for subsequent steps

      - name: Create Temporary Keychain for Signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "${HOME}/Library/Keychains/build.keychain"
          security default-keychain -s "${HOME}/Library/Keychains/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "${HOME}/Library/Keychains/build.keychain"
          security set-keychain-settings -t 3600 -l "${HOME}/Library/Keychains/build.keychain"
          echo "Temporary keychain created and unlocked."

      - name: Configure App Store Connect API Key for Xcode CLI
        env:
          ASC_PRIVATE_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          echo "App Store Connect API key saved to ~/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Build and Archive iOS App
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=$(git rev-list --count HEAD) \
            --build-name=1.0.0.$(git rev-list --count HEAD)
          
          ls -l build/ios/ipa/

      - name: Upload IPA to TestFlight
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa")
          echo "Found IPA: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

          echo "Upload command executed. Check App Store Connect for processing status."
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Delete Temporary Keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.XCODE_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "${HOME}/Library/Keychains/build.keychain"
          echo "Temporary keychain deleted."

      - name: Upload IPA artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-app
          path: build/ios/ipa/*.ipa
          retention-days: 7
