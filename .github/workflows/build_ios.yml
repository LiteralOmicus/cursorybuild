# This workflow builds and uploads an iOS app to TestFlight
# using direct xcodebuild commands for reliable code signing in CI.
name: build-test-xcodebuild

# Controls when the workflow will run
on:
  # rebuild any PRs and main branch changes
  push:
    branches:
      - main # Trigger the workflow on pushes to the 'main' branch.
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build: # make sure build/ci work properly
    # Specify the operating system for the runner
    runs-on: macos-latest
    # timeout-minutes: 30 # Uncomment and adjust if needed

    # Grant permissions for the github_token for this job
    permissions:
      contents: write # This grants write access to repository contents, including refs

    # Set environment variables that can be defined directly
    env:
      # WARNING: This allows the use of deprecated and potentially insecure commands
      # like ::set-env and ::add-path. Only use this if necessary and understand
      # the security implications. It's recommended to update actions to use
      # environment files instead.
      ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'
      # Make the private key available as an environment variable for xcodebuild authentication
      APPSTORE_PRIVATE_KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      # Define the temporary keychain name created by Apple-Actions
      KEYCHAIN_NAME: "signing_temp.keychain-db"
      # KEYCHAIN_PATH cannot be defined here referencing KEYCHAIN_NAME using ${{ env... }}

    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4 # Use v4 for newer features and security

      # Set up Flutter SDK
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Specify the Flutter channel
          # flutter-version: 'X.Y.Z' # Uncomment if you need a specific version

      # Run flutter pub get to fetch dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # --- New Step to Calculate and Export Keychain Path ---
      # Calculate the full path to the temporary keychain and export it as an environment variable.
      # This needs to be done in a run step because we need to use the $RUNNER_USER_HOME env var
      # and reference the KEYCHAIN_NAME env var set in the job env block.
      - name: Set Keychain Path Environment Variable
        run: |
          # Construct the full path using RUNNER_USER_HOME and the defined KEYCHAIN_NAME
          # $RUNNER_USER_HOME is automatically set by GitHub Actions for the runner's user's home directory.
          FULL_KEYCHAIN_PATH="$RUNNER_USER_HOME/Library/Keychains/${{ env.KEYCHAIN_NAME }}"
          echo "Calculated Keychain Path: $FULL_KEYCHAIN_PATH"
          # Export the full path as an environment variable using the GITHUB_ENV file
          # This makes the KEYCHAIN_PATH variable available to all subsequent steps in this job.
          echo "KEYCHAIN_PATH=$FULL_KEYCHAIN_PATH" >> $GITHUB_ENV

      # Imports Apple signing certificates from GitHub Secrets
      - name: Import Code Signing Certificate
        uses: Apple-Actions/import-codesign-certs@v2 # Use v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }} # Base64 content of your .p12 certificate
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }} # Password for your .p12 file
          keychain: ${{ env.KEYCHAIN_NAME }} # Use the defined keychain name
          create-keychain: true # Explicitly create the keychain
          # The action should make this keychain searchable, but we add diagnostics and explicit path use

      # --- Diagnostic Step ---
      # Verify the signing identity is present specifically in the created keychain file
      # This step now uses the KEYCHAIN_PATH environment variable set in the previous step.
      - name: Verify Identity in Specific Keychain
        run: |
          echo "Listing identities specifically in ${{ env.KEYCHAIN_NAME }} at ${{ env.KEYCHAIN_PATH }}:"
          # This command is the most direct check to see if the certificate is usable in the keychain file.
          # It explicitly targets the temporary keychain file path using the environment variable.
          # Use || true to prevent step failure if no identities found yet, allowing workflow to continue for more logs
          security find-identity -v -p codesigning "${{ env.KEYCHAIN_PATH }}" || true

      # Downloads provisioning profiles from Apple using App Store Connect API Key
      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v2 # Use v2
        with:
          bundle-id: com.literalomicus.kangarule # Your app's Bundle ID
          profile-type: 'IOS_APP_STORE' # Specify the profile type (IOS_APP_STORE, IOS_APP_DEVELOPMENT, etc.)
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }} # Your App Store Connect Issuer ID (from secret)
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }} # Your App Store Connect Key ID (from secret)
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY_CONTENT }} # Use the environment variable

      # --- Diagnostic Step ---
      # Check if the provisioning profile was downloaded to the correct directory
      - name: Verify Provisioning Profile Download
        run: |
          echo "Checking provisioning profile directory: ~/Library/MobileDevice/Provisioning Profiles/"
          ls -laR ~/Library/MobileDevice/Provisioning\ Profiles/ || true # Use || true if directory is empty

      # Find the exact Code Signing Identity name from the keychain and store it in an environment variable
      # This is needed for the CODE_SIGN_IDENTITY argument in xcodebuild archive
      # This step now uses the KEYCHAIN_PATH environment variable set earlier.
      - name: Get Code Signing Identity Name
        id: get_signing_identity
        run: |
          echo "Searching for signing identity name in ${{ env.KEYCHAIN_PATH }}"

          # Find the exact name of the Distribution identity in the keychain
          # Adjust the grep pattern "Apple Distribution:" if your certificate type is different (e.g., "Apple Development:")
          # This specifically searches the temporary keychain created earlier using the environment variable.
          IDENTITY_NAME=$(security find-identity -p codesigning -v "${{ env.KEYCHAIN_PATH }}" 2>&1 | grep "Apple Distribution:" | head -n 1 | sed -E 's/.*"(.+)".*/\1/')

          if [ -z "$IDENTITY_NAME" ]; then
            echo "Error: Code signing identity not found in ${{ env.KEYCHAIN_PATH }}. Build cannot proceed."
            # Exit the step with a failure code if identity is not found
            exit 1
          else
            echo "Found signing identity name: '$IDENTITY_NAME'"
            # Export the identity name as an environment variable for subsequent steps
            echo "CODE_SIGN_IDENTITY_NAME=$IDENTITY_NAME" >> $GITHUB_ENV
            # Use GITHUB_OUTPUT for setting step outputs (recommended over ::set-output)
            echo "identity_name=$IDENTITY_NAME" >> $GITHUB_OUTPUT
          fi

      # Generates a unique build number for the app
      # This action requires write permissions to create/update a Git ref.
      - name: "#️⃣ Generate Build Number"
        id: buildnumber # Assigns an ID to this step
        uses: einaregilsson/build-number@v2 # Consider updating if deprecated warning persists
        with:
          # The github_token is automatically provided by GitHub Actions
          # and is used by this action to interact with the GitHub API
          # to get information needed to generate the build number.
          # The 'contents: write' permission is needed for this.
          token: ${{ secrets.github_token }}

      # --- Use xcodebuild archive instead of flutter build ipa ---
      # This step now uses the KEYCHAIN_PATH and CODE_SIGN_IDENTITY_NAME environment variables.
      - name: Build and Archive iOS App
        run: |
          # Define paths and settings
          # Adjust to .xcodeproj if you don't have a workspace, or if your workspace name is different
          PROJECT_OR_WORKSPACE_PATH="./ios/Runner.xcworkspace" # Or ./ios/Runner.xcodeproj
          SCHEME_NAME="Runner" # Adjust if your scheme is named differently
          ARCHIVE_OUTPUT_PATH="build/Runner.xcarchive" # Standard output location

          echo "Building and archiving using xcodebuild..."
          echo "Keychain path: ${{ env.KEYCHAIN_PATH }}"
          echo "Signing Identity Name: ${{ env.CODE_SIGN_IDENTITY_NAME }}"
          echo "Team ID: ${{ secrets.APPLE_TEAM_ID }}"
          echo "Profile Specifier: literalomicus" # Assuming 'literalomicus' is the name of your App Store profile

          # Execute the xcodebuild archive command
          # Explicitly specify the keychain, signing identity, and team ID using environment variables.
          xcodebuild clean archive \
            -workspace "${PROJECT_OR_WORKSPACE_PATH}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${ARCHIVE_OUTPUT_PATH}" \
            # Signing Arguments - Ensure these match your desired distribution setup
            PROVISIONING_PROFILE_SPECIFIER="literalomicus" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY_NAME }}" \
            # App Store Connect API Authentication for provisioning updates
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -authenticationPrivateKey "${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}" \
            # Explicitly specify the temporary keychain using the environment variable
            -keychain "${{ env.KEYCHAIN_PATH }}" \
            # Add verbose output to help debug signing issues
            -verbose
          echo "xcodebuild archive command finished."

      # --- Use xcodebuild -exportArchive to create the IPA ---
      # This step now uses the KEYCHAIN_PATH environment variable.
      - name: Export IPA from Archive
        run: |
          # Define paths and settings
          ARCHIVE_INPUT_PATH="build/Runner.xcarchive" # Input from archive step
          IPA_OUTPUT_DIR="build/ios/ipa" # Desired output directory for the IPA
          # The ExportOptions.plist file is required for export
          EXPORT_OPTIONS_PLIST_PATH="./ios/ExportOptions.plist" # Adjust path if your plist is elsewhere

          echo "Exporting IPA from archive using xcodebuild..."
          echo "Archive path: ${ARCHIVE_INPUT_PATH}"
          echo "Export path: ${IPA_OUTPUT_DIR}"
          echo "ExportOptions.plist path: ${EXPORT_OPTIONS_PLIST_PATH}"
          echo "Keychain path: ${{ env.KEYCHAIN_PATH }}"

          # Create the output directory if it doesn't exist
          mkdir -p "${IPA_OUTPUT_DIR}"

          # Execute the xcodebuild -exportArchive command
          # Explicitly specify the keychain and authentication details.
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_INPUT_PATH}" \
            -exportPath "${IPA_OUTPUT_DIR}" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST_PATH}" \
            # App Store Connect API Authentication for provisioning updates during export (often needed)
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            -authenticationPrivateKey "${{ env.APPSTORE_PRIVATE_KEY_CONTENT }}" \
            # Explicitly specify the temporary keychain using the environment variable
            -keychain "${{ env.KEYCHAIN_PATH }}" \
            # Add verbose output
            -verbose
          echo "xcodebuild -exportArchive command finished."


      # Uploads the generated IPA file to App Store Connect for TestFlight
      - name: Upload IPA to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1 # Use v1 or master
        with:
          # The output path for the exported IPA
          app-path: build/ios/ipa/*.ipa # Path to the built IPA file (glob for the .ipa)
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }} # Your App Store Connect Issuer ID (from secret)
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }} # Your App Store Connect Key ID (from secret)
          api-private-key: ${{ env.APPSTORE_PRIVATE_KEY_CONTENT }} # Use the environment variable


      # Important! Cleanup: remove the certificate and provisioning profile from the runner!
      # Use 'always()' to ensure this runs even if previous steps fail.
      # This step now uses the KEYCHAIN_PATH environment variable.
      - name: Clean up keychain
        if: ${{ always() }}
        run: |
          echo "Cleaning up keychain: ${{ env.KEYCHAIN_PATH }}"
          # Delete the temporary keychain file using the environment variable
          security delete-keychain "${{ env.KEYCHAIN_PATH }}" || true # Use || true in case it wasn't created or already deleted
          echo "Keychain cleanup attempted."

          # Provisioning profiles in ~/Library/MobileDevice/Provisioning Profiles
          # are often cleaned up by the runner or handled by the download action,
          # but you can explicitly remove them if needed. Use with caution.
          # echo "Cleaning up provisioning profiles..."
          # rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/* || true
          # echo "Provisioning profile cleanup attempted."
